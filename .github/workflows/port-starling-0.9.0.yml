name: Port Starling 0.9.0 into Ray

on:
  push:
    branches:
      - port/starling-0.9.0

permissions:
  contents: write

concurrency:
  group: ray-starling-0.9.0-port-upstream-first
  cancel-in-progress: true

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Ray-Starling
        uses: actions/checkout@v4
        with:
          ref: Ray-Starling
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a coherent upstream-first integration tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=5432370d573642041585c69b40fb045b27133488
          EXPECTED=ff303502a4f7982551a0e0d3622d9268efe9e829
          RAY_HEAD="$(git rev-parse HEAD)"
          git fetch --depth=1 https://github.com/starling-client/starling.git refs/tags/v0.9.0:refs/tags/upstream-v0.9.0
          UPSTREAM="$(git rev-parse 'refs/tags/upstream-v0.9.0^{commit}')"
          test "$UPSTREAM" = "$EXPECTED"
          git fetch --depth=1 origin "$BASE"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$RAY_HEAD^{commit}"
          git config user.name "Ray Starling Integration"
          git config user.email "ray-starling-integration@users.noreply.github.com"

          # Apply only Ray's actual delta (BASE..RAY_HEAD) on top of the complete
          # 0.9.0 tree. This avoids retaining stale Ray files merely because an
          # entire file changed upstream and then mixing incompatible APIs.
          MERGE_OUTPUT="$(git merge-tree --write-tree --merge-base="$BASE" -X ours "$UPSTREAM" "$RAY_HEAD")"
          MERGED_TREE="$(printf '%s\n' "$MERGE_OUTPUT" | head -n 1)"
          if ! git cat-file -e "$MERGED_TREE^{tree}" 2>/dev/null; then
            echo "Could not produce the merged source tree:"
            printf '%s\n' "$MERGE_OUTPUT"
            exit 1
          fi
          if printf '%s\n' "$MERGE_OUTPUT" | grep -q '^CONFLICT '; then
            echo "The upstream-first merge still has unresolved conflicts:"
            printf '%s\n' "$MERGE_OUTPUT"
            exit 1
          fi

          # Keep the eventual integration commit as a single child of Ray's
          # current branch tip, so the final push remains a fast-forward.
          git read-tree --reset -u "$MERGED_TREE"

          # These modules were redesigned upstream for 0.9.0. Ray's older edits
          # overlap only in small hunks but depend on the pre-0.9.0 APIs; retain
          # the upstream implementations and reapply Ray's UI decisions in the
          # port helper instead of mixing incompatible implementations.
          git restore --source=refs/tags/upstream-v0.9.0 --worktree --staged -- \
            crates/horizon-client-render/src/extras.rs \
            crates/horizon-client-render/src/graphics.rs \
            crates/horizon-client-render/src/graphics_ui.rs \
            crates/horizon-client-render/src/options_ui.rs

          git diff --check
          echo "Upstream-first merged tree: $MERGED_TREE"
          git status --short


      - name: Check out the port helper
        uses: actions/checkout@v4
        with:
          ref: port/starling-0.9.0
          path: port-tools

      - name: Restore Ray's centered Starling Settings entry
        run: |
          python port-tools/scripts/port_ray_layout.py
          rm -rf port-tools

      - name: Verify Ray-specific behavior survived
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.raystarling.strong' packaging/android/build_apk.py
          test -f crates/horizon-client-render/src/android_controls/pojav_import.rs
          test -f crates/horizon-client-render/src/android_controls/zalith2_import.rs
          grep -q 'pub wheel_cycles_settings: bool' crates/horizon-client-render/src/extras.rs
          grep -q 'settings_y_rows' crates/horizon-client-render/src/options_ui/layout.rs
          grep -q 'Starling Settings...' crates/horizon-client/assets/horizon/lang/en_us.json
          grep -q 'VERSION_NAME = "0.9.0"' packaging/android/build_apk.py
          ! grep -q 'rustup toolchain install stable' .github/workflows/android.yml
          grep -q 'rustup_install.sh --profile minimal --target' .github/workflows/android.yml
          echo "Ray package, importers and graphics/settings layout checks passed."

      - name: Create the single integration commit locally before testing
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore: port Starling 0.9.0 into Ray Starling"

      - name: Check public tree and Python tooling
        run: |
          python tools/check_public_tree.py
          python -m unittest discover -s tests -v

      - name: Install Rust toolchain and native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal

      - name: Format the merged Rust tree and amend the single commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -A
          git commit --amend --no-edit

      - name: Format and lint
        env:
          HORIZON_TELEMETRY_URL: "off"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p horizon-client --all-targets --no-default-features -- -D warnings

      - name: Test Rust workspace
        env:
          HORIZON_TELEMETRY_URL: "off"
        run: |
          cargo test --workspace --lib --bins --tests
          cargo test --workspace --doc

      - name: Create exactly one integration commit and push Ray-Starling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/Ray-Starling
