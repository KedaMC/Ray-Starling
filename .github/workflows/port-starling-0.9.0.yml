name: Port Starling 0.9.0 into Ray

on:
  push:
    branches:
      - port/starling-0.9.0

permissions:
  contents: write

concurrency:
  group: ray-starling-0.9.0-port
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Ray-Starling
        uses: actions/checkout@v4
        with:
          ref: Ray-Starling
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the exact upstream release and prepare a bounded merge base
        shell: bash
        run: |
          set -euo pipefail
          BASE=5432370d573642041585c69b40fb045b27133488
          EXPECTED=ff303502a4f7982551a0e0d3622d9268efe9e829
          git fetch --depth=1 https://github.com/starling-client/starling.git refs/tags/v0.9.0:refs/tags/upstream-v0.9.0
          ACTUAL="$(git rev-parse 'refs/tags/upstream-v0.9.0^{commit}')"
          test "$ACTUAL" = "$EXPECTED"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git config user.name "Ray Starling Integration"
          git config user.email "ray-starling-integration@users.noreply.github.com"
          UPSTREAM_TREE="$(git rev-parse 'refs/tags/upstream-v0.9.0^{tree}')"
          SYNTHETIC_UPSTREAM="$(printf '%s\n' 'Starling 0.9.0 snapshot (synthetic parent at shared base)' | git commit-tree "$UPSTREAM_TREE" -p "$BASE")"
          echo "SYNTHETIC_UPSTREAM=$SYNTHETIC_UPSTREAM" >> "$GITHUB_ENV"

      - name: Squash upstream 0.9.0 into Ray, preferring Ray on overlapping hunks
        shell: bash
        run: |
          set -euo pipefail
          git merge --squash -X ours "$SYNTHETIC_UPSTREAM"
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths:"
            printf '%s\n' "$unresolved"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "The upstream snapshot produced no changes."
            exit 1
          fi
          echo "Merged change summary:"
          git diff --cached --stat


      - name: Restore Ray's centered Starling Settings entry in the 0.9 layout module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/horizon-client-render/src/options_ui/layout.rs")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"                let entries = \\[\\n"
              r"                    // Everywhere for the layers and Main Hand;.*?"
              r"                out\\.push\\(done\\(h - 27\\.0\\)\\);\\n",
              re.DOTALL,
          )
          replacement = """                // Starling Settings sits centered above the vanilla Options grid.
                let settings_key = "horizon.pages.open.horizon_settings";
                let settings_y_rows = [
                    ("options.skinCustomisation", Some(Page::Skin)),
                    ("options.sounds", Some(Page::Sound)),
                    ("options.video", Some(Page::Video)),
                    ("options.controls", Some(Page::Controls)),
                    (
                        "options.language",
                        (!self.split_guest).then_some(Page::Language),
                    ),
                    ("options.chat", Some(Page::Chat)),
                    (
                        "options.resourcepack",
                        (!self.split_guest).then_some(Page::Packs),
                    ),
                    ("options.accessibility", Some(Page::Accessibility)),
                    ("options.credits_and_attribution", Some(Page::Credits)),
                ];
                let entries = with_diagnostics(settings_y_rows);
                let rows = 1.0 + entries.len().div_ceil(2) as f32;
                let gy = (61.0 + 30.0f32).min(h - 33.0 - rows * 24.0);
                out.push(button(
                    cx - 75.0,
                    gy,
                    150.0,
                    tr(settings_key),
                    Act::Push(Page::Horizon),
                ));
                for (i, (key, page)) in entries.iter().enumerate() {
                    let x = cx - 158.0 + 4.0 + (i % 2) as f32 * 158.0;
                    let y = gy + 24.0 + (i / 2) as f32 * 24.0;
                    let b = button(x, y, 150.0, tr(key), page.map_or(Act::None, Act::Push));
                    out.push(if page.is_some() { b } else { inactive(b) });
                }
                out.push(done(h - 27.0));
"""
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one upstream Main options-grid block, found {count}")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify Ray-specific behavior survived
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.raystarling.strong' packaging/android/build_apk.py
          test -f crates/horizon-client-render/src/android_controls/pojav_import.rs
          test -f crates/horizon-client-render/src/android_controls/zalith2_import.rs
          ! grep -q 'Page::Quality' crates/horizon-client-render/src/graphics_ui.rs
          ! grep -q 'H::ResolutionScale' crates/horizon-client-render/src/graphics_ui.rs
          ! grep -q 'H::BatteryMode' crates/horizon-client-render/src/graphics_ui.rs
          ! grep -q 'Preset::' crates/horizon-client-render/src/graphics_ui.rs
          ! grep -q 'wheel_cycles_settings' crates/horizon-client-render/src/extras.rs
          grep -q 'settings_y_rows' crates/horizon-client-render/src/options_ui/layout.rs
          grep -q 'Starling Settings...' crates/horizon-client/assets/horizon/lang/en_us.json
          grep -q 'VERSION_NAME = "0.9.0"' packaging/android/build_apk.py
          echo "Ray package, importers and graphics/settings layout checks passed."

      - name: Check public tree and Python tooling
        run: |
          python tools/check_public_tree.py
          python -m unittest discover -s tests -v

      - name: Install Rust toolchain and native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Format and lint
        env:
          HORIZON_TELEMETRY_URL: "off"
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets -- -D warnings
          cargo +stable clippy -p horizon-client --all-targets --no-default-features -- -D warnings

      - name: Test Rust workspace
        env:
          HORIZON_TELEMETRY_URL: "off"
        run: |
          cargo +stable test --workspace --lib --bins --tests
          cargo +stable test --workspace --doc

      - name: Create exactly one integration commit and push Ray-Starling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: port Starling 0.9.0 into Ray Starling"
          git push origin HEAD:refs/heads/Ray-Starling
